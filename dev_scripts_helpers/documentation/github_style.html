<style>
  :root {
    color-scheme: light;
  }
  html {
    font-size: 18px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    line-height: 1.65;
    color: #1f2328;
    background-color: #ffffff;
    max-width: 1280px;
    margin: 32px auto;
    padding: 0 40px 64px;
  }
  h1, h2, h3, h4, h5, h6 {
    font-weight: 600;
    line-height: 1.25;
    margin-top: 28px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 2.2em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid #d1d9e0;
  }
  h2 {
    font-size: 1.7em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid #d1d9e0;
  }
  h3 { font-size: 1.35em; }
  h4 { font-size: 1.15em; }
  p, ul, ol, blockquote, table, pre {
    margin-top: 0;
    margin-bottom: 18px;
  }
  ul, ol {
    padding-left: 2.2em;
  }
  li + li { margin-top: 0.3em; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* verbatim: inline code + code blocks get a light yellowish background */
  code, tt {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Source Code Pro",
      Menlo, Consolas, monospace;
    font-size: 0.92em;
    background-color: #fffbdc;
    padding: 0.2em 0.4em;
    border-radius: 6px;
  }
  pre {
    background-color: #fffbdc;
    border: 1px solid #e6dfa8;
    border-radius: 8px;
    padding: 18px;
    overflow-x: auto;
    line-height: 1.5;
  }
  pre code {
    background-color: transparent;
    padding: 0;
    border-radius: 0;
    font-size: 0.92em;
  }

  blockquote {
    padding: 0 1em;
    color: #59636e;
    border-left: 0.25em solid #d1d9e0;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    display: block;
    overflow-x: auto;
  }
  table th, table td {
    padding: 8px 14px;
    border: 1px solid #d1d9e0;
  }
  table th {
    font-weight: 600;
    background-color: #f6f8fa;
  }
  table tr:nth-child(2n) {
    background-color: #f6f8fa;
  }

  img {
    max-width: 100%;
    display: block;
    margin: 20px auto;
  }

  hr {
    border: 0;
    border-top: 1px solid #d1d9e0;
    margin: 28px 0;
  }
</style>
