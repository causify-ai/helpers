[tool.ruff]
# Maximum allowed line length for code.
line-length = 81
# Target Python version for linting and autofixes.
target-version = "py311"
# Automatically apply fixes for linting issues when possible.
fix = true
# Exclude specific directories from linting and fixing.
exclude = [
  "**/outcomes/**",
  "**/import_check/example/**"
]
# Format of the output from Ruff.
output-format = "concise"

[tool.ruff.lint]
# Ignore specific lint rules
ignore = [
  # E731: Do not assign a `lambda` expression, use a `def`
  "E731",
  # FLY002: Consider f-string instead of string join (repo style uses `join`)
  "FLY002",
  # PLR0402: Use `from X import Y` (repo style is `import X.Y as Y`)
  "PLR0402",
  # RUF100: Unused `noqa` (keep `# noqa: E402` after `pytest.importorskip`)
  "RUF100",
  # UP006: Use `dict` instead of `Dict` (repo style uses `typing.Dict/List`)
  "UP006",
  # UP007: Use `X | Y` for type annotations (repo style uses `typing.Union`)
  "UP007",
  # UP031: Use format specifiers instead of percent format (repo style uses `%`)
  "UP031",
  # UP035: Import from `typing` is deprecated (repo style uses `typing`)
  "UP035",
  # UP045: Use `X | None` for type annotations (repo style uses `typing.Optional`)
  "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Tutorial notebooks paired with jupytext have code cells before imports.
# E402: Module level import not at top of file
# N999: Invalid module name (tutorial files are named like `L05_01_01_*.py`)
"**/tutorials/**/*.py" = ["E402", "N999"]
"**/tutorials/**/*.ipynb" = ["E402", "N999"]

[tool.pyrefly]
# Currently, Pyrefly doesn't officially support [tool.pyrefly] config
# Instead, use CLI flags like `pyrefly lint . --config path/to/config.yaml`
# But you can still define this for documentation or future support
path = "."

#[tool.fixit]
#ignore_codes = []
#enabled = true
#format = "text"
#exclude = [
#  "**/outcomes/**",
#  "**/import_check/example/**"
#]
#show_source = true

[tool.docformatter]
# Disable summary/description wrapping: keep each on a single line.
wrap-summaries = 0
wrap-descriptions = 0
# Put closing """ of multi-line docstring on own line after summary.
pre-summary-newline = true
# Same as pre-summary-newline, but also covers docstrings that are just a
# single summary sentence (no separate description paragraph).
make-summary-multi-line = true
# Move closing quotes to own line when doc wraps to multiple lines.
close-quotes-on-newline = true

# pyproject.toml
[tool.jupytext]
# Pair by default.
formats = "ipynb,py:percent"
